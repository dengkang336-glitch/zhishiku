<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技术知识库</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="打开目录" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <div class="brand" id="brand" title="回到首页">
      <span class="brand-mark">K</span>
      <span class="brand-name">技术知识库</span>
    </div>
    <button class="paths-btn" id="paths-btn" type="button">学习路径</button>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" />
      </svg>
      <input id="search" type="text" placeholder="搜索技术、组件、场景…（如：按钮 / React / 什么时候用缓存）" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>

  <div class="nav-scrim" id="nav-scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="tree" class="tree"></nav>
    </aside>

    <main class="content" id="content">
      <div class="empty-state">
        <h1>欢迎来到技术知识库</h1>
        <p>从左侧目录选择一个技术类别开始，或用顶部搜索框直接搜。</p>
        <p class="muted">每个条目都会用大白话讲清楚：<strong>是什么 → 什么时候用 → 常见场景 → 长什么样</strong>。</p>
      </div>
    </main>
  </div>

  <script src="data/frontend.js"></script>
  <script src="data/backend.js"></script>
  <script src="data/database.js"></script>
  <script src="data/middleware.js"></script>
  <script src="data/cloud.js"></script>
  <script src="data/devops.js"></script>
  <script src="data/mobile.js"></script>
  <script src="data/ai.js"></script>
  <script src="data/language.js"></script>
  <script src="data/architecture.js"></script>
  <script src="data/security.js"></script>
  <script src="data/testing.js"></script>
  <script src="data/data.js"></script>
  <script src="data/pitfalls.js"></script>
  <script src="data/paths.js"></script>
  <script src="app.js"></script>
</body>
</html>
